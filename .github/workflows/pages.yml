# Publica la versión web de Junto en GitHub Pages en cada push a main.
#   App real (conectada a Supabase): https://<usuario>.github.io/<repo>/
#   Simulador (datos de ejemplo):    https://<usuario>.github.io/<repo>/simulador/
# Configuración paso a paso: GITHUB-PAGES.md.
# Acciones fijadas por SHA (cadena de suministro, SECURITY.md · Dependencias y CI).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar la web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      # Valores PÚBLICOS (URL del proyecto y clave publicable). Se guardan como variables del
      # repositorio: Settings → Secrets and variables → Actions → Variables.
      # Nunca pongas aquí la service_role / secret key.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # El sitio vive en /<repo>/, no en la raíz del dominio (lo lee mobile/app.config.js).
      EXPO_BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Revisar la conexión a Supabase
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Faltan las variables EXPO_PUBLIC_SUPABASE_URL y EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY (GITHUB-PAGES.md, paso 4)."
            exit 1
          fi
          case "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) echo "::error::Pusiste la clave SECRETA. Usa la publicable (sb_publishable_... o anon)."; exit 1 ;;
          esac
      - run: npm ci
      - name: Exportar la web
        run: npx expo export --platform web --output-dir dist
      - name: Preparar el sitio
        run: |
          # Pages no sabe que /plan/123 es una ruta de la app: el 404 devuelve la app y ella resuelve la ruta.
          cp dist/index.html dist/404.html
          cp -r ../simulador dist/simulador
          rm -f dist/simulador/vercel.json dist/simulador/README.md
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: mobile/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
